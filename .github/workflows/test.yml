name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # These stable job names are part of the repository's merge policy. The
  # base-side .github/grabowski-required-checks.json is the canonical contract
  # consumed by Grabowski's review gate; the GitHub ruleset mirrors the same
  # contexts. Keep these names stable or update both policy surfaces together.
  #
  # The `pytest` job stays single-version and unrenamed because a matrix would
  # change its status-check context to e.g. `pytest (3.10)`. Broader interpreter
  # coverage remains the separate `pytest-3-11` job.
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest==8.3.5
      - run: pytest -q

  pytest-3-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest==8.3.5
      - run: pytest -q

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ruff==0.15.13
      - run: ruff check .
